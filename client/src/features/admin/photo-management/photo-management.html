@if (photosForApproval(); as photos) {
  <div class="flex flex-col w-full">
    <div class="grid grid-cols-6 gap-4">
      @for (photo of photos; track photo.id) {
        <div class="card">
          <img src="{{ photo.url }}" alt="{{ photo.id }}" class="img-thumbnail p-1 rounded-sm" />

          <div class="card-actions">
            <div class="flex w-full justify-between gap-2 mt-1">
              <button (click)="approvePhoto(photo.id)" class="btn grow btn-success">Approve</button>
              <button (click)="rejectPhoto(photo.id)" class="btn grow btn-error">Reject</button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
}
